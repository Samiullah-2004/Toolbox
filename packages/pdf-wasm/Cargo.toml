[package]
name = "pdf-wasm"
version = "0.1.0"
edition = "2024"
description = "Toolbox PDF engine: merge, split, reorder and rotate PDF pages in the browser (WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = { version = "=0.45.0", default-features = false }
# same version lopdf uses; needed to name the error type of our custom random source
getrandom = { version = "0.4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
